[package]
name = "kloer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reference-relative exact compression for unitig FASTA files"

[[bin]]
name = "kloer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
rammap-core = { version = "1.1.2", default-features = false, features = ["parallel"] }
rayon = "1.11"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 16
